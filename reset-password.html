<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعيين كلمة المرور الجديدة | Reset Password</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    html:not(.verified-access) body {
      display: none !important;
    }
  </style>
  <script>
    (function() {
      try {
        var rawHash = window.location.hash || '';
        var rawSearch = window.location.search || '';
        var h = new URLSearchParams(rawHash.replace(/^#/, ''));
        var q = new URLSearchParams(rawSearch.replace(/^\?/, ''));

        // Reject any error redirects or bare copy-pasted URLs immediately
        if (h.has('error') || q.has('error') || h.has('error_code') || q.has('error_code')) {
          window.location.replace('index.html');
          return;
        }

        var accessToken = h.get('access_token') || q.get('access_token') || '';
        var refreshToken = h.get('refresh_token') || q.get('refresh_token') || '';
        var code = q.get('code') || h.get('code') || '';
        var tokenHash = q.get('token_hash') || h.get('token_hash') || '';
        var tokenType = h.get('type') || q.get('type') || 'recovery';

        // Require an actual non-empty cryptographic recovery token from the email link
        var hasValidResetToken = (accessToken.length >= 20) || (code.length >= 10) || (tokenHash.length >= 16);
        if (!hasValidResetToken) {
          window.location.replace('index.html');
          return;
        }

        // One-time token consumption check: prevents re-opening the page by copy-pasting the email link
        var tokenSignature = (accessToken || code || tokenHash).slice(-36);
        var storageKey = 'fp_reset_consumed_' + tokenSignature;
        if (tokenSignature && localStorage.getItem(storageKey)) {
          window.location.replace('index.html');
          return;
        }
        if (tokenSignature) {
          localStorage.setItem(storageKey, String(Date.now()));
        }

        // Preserve tokens in memory, then immediately scrub the browser URL bar
        // so copying the URL from the browser address bar only copies a bare URL
        window.__RESET_ACCESS_TOKEN__ = accessToken;
        window.__RESET_REFRESH_TOKEN__ = refreshToken;
        window.__RESET_CODE__ = code;
        window.__RESET_TOKEN_HASH__ = tokenHash;
        window.__RESET_TYPE__ = tokenType;
        window.history.replaceState(null, document.title, window.location.pathname);
      } catch (e) {
        window.location.replace('index.html');
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <img src="logo.svg" alt="Logo" class="brand-logo">
        <div class="brand-title">منبه البصمة الذكي</div>
      </a>
      <a href="index.html" class="btn-nav-download">الرئيسية</a>
    </div>
  </header>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-icon-circle">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <h1>تعيين كلمة المرور الجديدة</h1>
      <p>أدخل كلمة مرور قوية وجديدة لحسابك لتتمكن من تسجيل الدخول والمزامنة.</p>

      <div id="userBadge" style="display: none; margin-bottom: 18px; padding: 10px 14px; background: rgba(0, 245, 160, 0.1); border: 1px solid rgba(0, 245, 160, 0.3); border-radius: 10px; font-size: 0.9rem; color: var(--text-primary); text-align: center;">
        <span>إعادة تعيين كلمة المرور للحساب: </span><strong id="userBadgeEmail" style="color: var(--neon-accent); direction: ltr; display: inline-block;"></strong>
      </div>

      <form id="resetForm" onsubmit="handlePasswordReset(event)">
        <div class="form-group">
          <label class="form-label" for="newPassword">كلمة المرور الجديدة</label>
          <div class="password-input-wrapper">
            <input type="password" id="newPassword" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
            <button type="button" class="btn-toggle-pass" onclick="togglePasswordVisibility('newPassword', this)" aria-label="إظهار/إخفاء كلمة المرور">
              <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">تأكيد كلمة المرور</label>
          <div class="password-input-wrapper">
            <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
            <button type="button" class="btn-toggle-pass" onclick="togglePasswordVisibility('confirmPassword', this)" aria-label="إظهار/إخفاء كلمة المرور">
              <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-off-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          حفظ كلمة المرور الجديدة
        </button>

        <div id="statusMessage" class="status-msg"></div>
      </form>

      <!-- Post-Reset Success State Actions -->
      <div id="postResetActions" style="display: none; margin-top: 20px; flex-direction: column; gap: 12px;">
        <div class="countdown-box" id="resetCountdownBox" style="text-align: center;">
          سيتم فتح تطبيق منبه البصمة تلقائياً خلال <span id="resetCountdown">3</span> ثوانٍ...
        </div>

        <button type="button" onclick="openApp()" class="btn-submit" style="text-decoration:none; display:flex; align-items:center; justify-content:center; gap:8px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
          فتح تطبيق منبه البصمة الآن
        </button>
      </div>

      <!-- Navigation & App Links -->
      <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px;">
        <button type="button" id="openAppPromptBtn" onclick="openApp()" class="lang-btn" style="text-decoration:none; justify-content:center; padding:12px; font-weight:700; border-color: rgba(0, 245, 160, 0.3); color: var(--neon-accent); background: rgba(0, 245, 160, 0.05); gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
          فتح التطبيق على الهاتف
        </button>

        <a href="index.html" class="lang-btn" style="text-decoration:none; justify-content:center; padding:10px; opacity:0.85;">
          العودة للصفحة الرئيسية للموقع
        </a>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://hnwrsxowdrwmoosyjbro.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhud3JzeG93ZHJ3bW9vc3lqYnJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDM3ODgsImV4cCI6MjEwMTUxOTc4OH0.aSf2oslOt8QKBjX7G7wbUONKiVa3ro4dZSV2h3n_o64";

    // Disable persistent session caching so visiting reset-password.html directly never reuses a cached browser session
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        autoRefreshToken: false,
        persistSession: false,
        detectSessionInUrl: false
      }
    });

    let activeRecoverySession = null;

    function showStatus(html, type) {
      const statusEl = document.getElementById('statusMessage');
      if (!statusEl) return;
      statusEl.className = 'status-msg ' + type;
      statusEl.innerHTML = html;
      statusEl.style.display = 'block';
    }

    function hideStatus() {
      const statusEl = document.getElementById('statusMessage');
      if (!statusEl) return;
      statusEl.className = 'status-msg';
      statusEl.innerHTML = '';
      statusEl.style.display = 'none';
    }

    function showUserBadge(email) {
      if (!email) return;
      const badge = document.getElementById('userBadge');
      const badgeEmail = document.getElementById('userBadgeEmail');
      if (badge && badgeEmail) {
        badgeEmail.textContent = email;
        badge.style.display = 'block';
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const eyeIcon = btn.querySelector('.eye-icon');
      const eyeOffIcon = btn.querySelector('.eye-off-icon');

      if (input.type === 'password') {
        input.type = 'text';
        if (eyeIcon) eyeIcon.style.display = 'none';
        if (eyeOffIcon) eyeOffIcon.style.display = 'block';
        btn.setAttribute('aria-label', 'إخفاء كلمة المرور');
      } else {
        input.type = 'password';
        if (eyeIcon) eyeIcon.style.display = 'block';
        if (eyeOffIcon) eyeOffIcon.style.display = 'none';
        btn.setAttribute('aria-label', 'إظهار كلمة المرور');
      }
    }

    function openApp() {
      const customScheme = "fingerprint://auth/callback";
      const androidIntent = "intent://auth/callback#Intent;scheme=fingerprint;package=com.aistudio.fingerprintreminder.ktzmsa;end";
      const isAndroid = /android/i.test(navigator.userAgent);

      if (isAndroid) {
        window.location.href = androidIntent;
        setTimeout(() => {
          window.location.href = customScheme;
        }, 500);
      } else {
        window.location.href = customScheme;
      }
    }

    // Verify recovery token with Supabase before revealing the page; redirect to home if invalid/expired
    async function initResetSession() {
      const accessToken = window.__RESET_ACCESS_TOKEN__ || '';
      const refreshToken = window.__RESET_REFRESH_TOKEN__ || '';
      const code = window.__RESET_CODE__ || '';
      const tokenHash = window.__RESET_TOKEN_HASH__ || '';
      const tokenType = window.__RESET_TYPE__ || 'recovery';

      try {
        if (code) {
          const { data, error } = await supabaseClient.auth.exchangeCodeForSession(code);
          if (error || !data || !data.session) {
            window.location.replace('index.html');
            return;
          }
          activeRecoverySession = data.session;
          showUserBadge(data.session.user?.email);
          document.documentElement.classList.add('verified-access');
          return;
        }

        if (tokenHash) {
          const { data, error } = await supabaseClient.auth.verifyOtp({
            token_hash: tokenHash,
            type: tokenType === 'recovery' ? 'recovery' : 'email'
          });
          if (error || !data || !data.session) {
            window.location.replace('index.html');
            return;
          }
          activeRecoverySession = data.session;
          showUserBadge(data.session.user?.email);
          document.documentElement.classList.add('verified-access');
          return;
        }

        if (accessToken) {
          const { data, error } = await supabaseClient.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken || ''
          });
          if (error || !data || !data.session) {
            window.location.replace('index.html');
            return;
          }
          activeRecoverySession = data.session;
          showUserBadge(data.session.user?.email);
          document.documentElement.classList.add('verified-access');
          return;
        }

        window.location.replace('index.html');
      } catch (e) {
        window.location.replace('index.html');
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initResetSession);
    } else {
      initResetSession();
    }

    async function handlePasswordReset(e) {
      e.preventDefault();
      hideStatus();

      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      const submitBtn = document.getElementById('submitBtn');

      if (!newPass || !confirmPass) {
        showStatus('يرجى ملء جميع الحقول المطلوبة', 'error');
        return;
      }

      if (newPass.length < 6) {
        showStatus('يجب أن تتكون كلمة المرور من 6 أحرف على الأقل', 'error');
        return;
      }

      if (newPass !== confirmPass) {
        showStatus('كلمتا المرور غير متطابقتين، يرجى التأكد وإعادة المحاولة', 'error');
        return;
      }

      if (!activeRecoverySession) {
        window.location.replace('index.html');
        return;
      }

      submitBtn.disabled = true;
      const originalBtnText = submitBtn.textContent;
      submitBtn.textContent = 'جاري حفظ كلمة المرور...';

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: newPass
        });

        if (error) {
          let errorMsg = error.message || 'حدث خطأ أثناء تحديث كلمة المرور';
          if (errorMsg.includes('different') || errorMsg.includes('same_password')) {
            errorMsg = 'يجب أن تكون كلمة المرور الجديدة مختلفة عن كلمة المرور السابقة';
          } else if (errorMsg.includes('least 6 characters')) {
            errorMsg = 'يجب أن تتكون كلمة المرور من 6 أحرف على الأقل';
          }
          showStatus(errorMsg, 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = originalBtnText;
        } else {
          // Sign out recovery session immediately so it cannot be reused
          await supabaseClient.auth.signOut().catch(() => {});
          activeRecoverySession = null;

          showStatus(`
            <div style="display:flex; flex-direction:column; gap:6px; text-align:center;">
              <span style="font-weight:700; font-size:1.1rem; color:var(--neon-accent);">تم تحديث كلمة المرور بنجاح! ✨</span>
              <span style="font-size:0.9rem; color:#D1DED9;">تم حفظ كلمة المرور الجديدة بنجاح. يمكنك الآن العودة إلى التطبيق وتسجيل الدخول.</span>
            </div>
          `, 'success');

          document.querySelectorAll('.form-group').forEach(el => el.style.display = 'none');
          submitBtn.style.display = 'none';

          const postResetActions = document.getElementById('postResetActions');
          if (postResetActions) {
            postResetActions.style.display = 'flex';
          }

          let secondsLeft = 3;
          const countdownEl = document.getElementById('resetCountdown');
          const countdownBox = document.getElementById('resetCountdownBox');

          const timer = setInterval(() => {
            secondsLeft--;
            if (countdownEl) {
              countdownEl.textContent = secondsLeft;
            }
            if (secondsLeft <= 0) {
              clearInterval(timer);
              if (countdownBox) {
                countdownBox.textContent = "جاري فتح التطبيق على هاتفك...";
              }
              openApp();
            }
          }, 1000);
        }
      } catch (err) {
        showStatus(err.message || 'تعذر الاتصال بالخادم، يرجى التحقق من اتصال الإنترنت', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = originalBtnText;
      }
    }
  </script>
</body>
</html>
