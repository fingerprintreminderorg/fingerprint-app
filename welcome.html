<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم تأكيد الحساب بنجاح | Welcome to Fingerprint Reminder</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Minimal Header -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">
        <img src="logo.svg" alt="Logo" class="brand-logo">
        <div class="brand-title">منبه البصمة الذكي</div>
      </a>
      <a href="index.html" class="btn-nav-download">الرئيسية</a>
    </div>
  </header>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-icon-circle">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <h1>أهلاً بك معنا! تم تأكيد بريدك بنجاح ✨</h1>
      <p>
        شكراً لتأكيد بريدك الإلكتروني. حسابك الآن مفعل بالكامل وجاهز للاستخدام ومزامنة جدول البصمات في أي وقت.
      </p>

      <div class="countdown-box" id="redirectStatus">
        سيتم فتح تطبيق منبه البصمة تلقائياً خلال <span id="countdown">3</span> ثوانٍ...
      </div>

      <div style="margin-top:28px; display:flex; flex-direction:column; gap:12px;">
        <!-- Deep Link Intent Button -->
        <button type="button" id="openAppBtn" onclick="openApp()" class="btn-submit" style="display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:none; cursor:pointer;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
          فتح تطبيق منبه البصمة الآن
        </button>

        <a href="https://github.com/fingerprintreminderorg/fingerprint-app/releases/latest/download/fingerprint-reminder.apk" class="lang-btn" style="text-decoration:none; justify-content:center; padding:12px;">
          لم تقم بتحميل التطبيق بعد؟ اضغط هنا للتحميل المباشر
        </a>
      </div>
    </div>
  </div>

  <script>
    let secondsLeft = 3;
    const countdownEl = document.getElementById('countdown');
    const redirectStatusEl = document.getElementById('redirectStatus');

    // Extract auth tokens (e.g. access_token, refresh_token) from URL hash or query params
    const hash = window.location.hash || "";
    const search = window.location.search || "";
    const rawParams = (hash.startsWith('#') ? hash.substring(1) : (search.startsWith('?') ? search.substring(1) : (hash || search)));
    const queryPart = rawParams ? ("?" + rawParams) : "";
    const customScheme = "fingerprint://auth/callback" + (rawParams ? ("#" + rawParams) : "");
    const androidIntent = "intent://auth/callback" + queryPart + "#Intent;scheme=fingerprint;package=com.aistudio.fingerprintreminder.ktzmsa;end";

    // Direct app opening matching reset-password.html: clean Intent targeting with zero prompt popups
    function openApp() {
      const isAndroid = /android/i.test(navigator.userAgent);
      if (isAndroid) {
        window.location.href = androidIntent;
      } else {
        window.location.href = customScheme;
      }
    }

    const timer = setInterval(() => {
      secondsLeft--;
      if (countdownEl) {
        countdownEl.textContent = secondsLeft;
      }
      if (secondsLeft <= 0) {
        clearInterval(timer);
        if (redirectStatusEl) {
          redirectStatusEl.textContent = "جاري فتح التطبيق على هاتفك...";
        }
        openApp();
      }
    }, 1000);
  </script>
</body>
</html>
